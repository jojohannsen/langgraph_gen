<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Specification Editor</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .editor {
            flex-grow: 1;
            background-color: #1e1e1e;
            color: #ffffff;
            padding: 10px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .line {
            font-family: monospace;
            font-size: 14px;
            white-space: pre;
            min-height: 1em;
        }
        .line:focus {
            outline: none;
            background-color: #2a2a2a;
        }
        .cyan { color: #00ffff; }
        .lg_condition { color: #ffa500; }
        .lg_node { color: #00ff00; }
    </style>
</head>
<body>
    <div class="container">
        <div class="editor" id="editor"></div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function () {
        const editor = document.getElementById('editor');
        const cursorInfo = document.getElementById('cursorInfo');
        let lines = [];

        function getLgConditionLength(clickedElement) {
            if (clickedElement && clickedElement.classList.contains('lg_node')) {
                let sibling = clickedElement.previousElementSibling;
                if (sibling && sibling.classList.contains('lg_condition')) {
                    return sibling.textContent.trim().length;
                }
            }
            return 0;
        }

        function calculateTrueOffset(element, clickOffset) {
            const conditionLength = getLgConditionLength(element);
            return conditionLength + clickOffset;
        }

        function handleLineInput(event) {
            const lineElement = event.target;
            const lineIndex = parseInt(lineElement.getAttribute('data-line-index'));
            const oldText = lines[lineIndex];
            const newText = lineElement.textContent;
            const selection = window.getSelection();
            let cursorPosition = calculateTrueOffset(lineElement, selection.anchorOffset);
            const span = getSpanWhereInputIsOccurring();
            let lgConditionLength = getLgConditionLength(span);
            if (lgConditionLength > 0) {
                const leadingSpaces = newText.match(/^\s*/)[0];
                lgConditionLength += leadingSpaces.length + 1;
            }
            lines[lineIndex] = newText;
            renderLine(lineIndex);
            cursorPosition += lgConditionLength;
            setCaretPosition(lineElement, cursorPosition);
            sendGraphToBackend(lineIndex, oldText, newText, cursorPosition);
        }

        function setCaretPosition(element, position) {
            const range = document.createRange();
            const sel = window.getSelection();
            let currentOffset = 0;
            let targetNode = null;
            let targetOffset = 0;

            function traverseNodes(node) {
                if (currentOffset >= position) return true;
                if (node.nodeType === Node.TEXT_NODE) {
                    if (currentOffset + node.length >= position) {
                        targetNode = node;
                        targetOffset = position - currentOffset;
                        return true;
                    }
                    currentOffset += node.length;
                } else if (node.nodeType === Node.ELEMENT_NODE) {
                    for (let i = 0; i < node.childNodes.length; i++) {
                        if (traverseNodes(node.childNodes[i])) return true;
                    }
                }
                return false;
            }

            traverseNodes(element);

            if (targetNode) {
                range.setStart(targetNode, targetOffset);
            } else {
                range.selectNodeContents(element);
                range.collapse(false);
            }

            sel.removeAllRanges();
            sel.addRange(range);
        }

        function colorCode(line) {
            const trimmedLine = line.trim();
            const leadingSpaces = line.match(/^\s*/)[0];

            if (trimmedLine.match(/^[a-zA-Z_]+$/)) {
                return `<span class="cyan">${leadingSpaces}${trimmedLine}</span>`;
            } else if (trimmedLine.startsWith('=>')) {
                return `<span class="lg_node">${leadingSpaces}${trimmedLine}</span>`;
            } else if (trimmedLine.includes('=>')) {
                const parts = trimmedLine.split('=>');
                const condition = parts[0].trim();
                const rest = parts.slice(1).join('=>').trim();
                return `<span class="lg_condition">${leadingSpaces}${condition}</span> <span class="lg_node">=> ${rest}</span>`;
            }
            return `<span>${line}</span>`;
        }

        function renderLine(lineIndex) {
            const lineElement = editor.children[lineIndex];
            lineElement.innerHTML = colorCode(lines[lineIndex]);
        }

        function renderLines() {
            editor.innerHTML = lines.map((line, index) =>
                `<div class="line" contenteditable="true" data-line-index="${index}">${colorCode(line)}</div>`
            ).join('');
            attachLineListeners();
        }

        function getSpanWhereInputIsOccurring() {
            const selection = document.getSelection();
            if (!selection.rangeCount) return null;

            const range = selection.getRangeAt(0);
            let node = range.startContainer;

            while (node) {
                if (node.nodeType === Node.ELEMENT_NODE) {
                    if (node.tagName === 'SPAN') {
                        return node;
                    } else if (node.tagName === 'DIV') {
                        return null;
                    }
                }
                node = node.parentElement;
            }

            return null;
        }

        function attachLineListeners() {
            document.querySelectorAll('.line').forEach(lineElement => {
                lineElement.addEventListener('input', handleLineInput);
                lineElement.addEventListener('keydown', handleLineKeydown);
            });
        }

        function handleLineKeydown(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                const lineElement = event.target;
                const lineIndex = parseInt(lineElement.getAttribute('data-line-index'));
                const cursorPosition = window.getSelection().anchorOffset;
                const currentLine = lines[lineIndex];
                const newLine = currentLine.slice(cursorPosition);
                lines[lineIndex] = currentLine.slice(0, cursorPosition);
                lines.splice(lineIndex + 1, 0, newLine);
                renderLines();
                focusLine(lineIndex + 1, 0);
                sendGraphToBackend();
            }
        }

        function focusLine(lineIndex, charIndex) {
            const lineElement = editor.children[lineIndex];
            if (lineElement) {
                lineElement.focus();
                setCaretPosition(lineElement, charIndex);
            }
        }

        function sendGraphToBackend(changedLineIndex, oldLineText, newLineText, cursorPosition) {
            const graph = lines.join('\n');
            fetch('/update_graph', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    graph: graph,
                    changedLine: {
                        index: changedLineIndex,
                        oldText: oldLineText,
                        newText: newLineText,
                        cursorPosition: cursorPosition
                    }
                }),
            })
            .then(response => response.json())
            .catch((error) => {});
        }

        // Initialize with some content
        lines = [
            "agent",
            "  => evaluator",
            "",
            "evaluator",
            "  good_enough => END",
            "  => agent"
        ];
        renderLines();
        sendGraphToBackend();

        // Add a click listener to the editor to handle clicks between lines
        editor.addEventListener('click', (event) => {
            if (event.target === editor) {
                const lineIndex = Math.min(
                    Math.floor(event.offsetY / (event.target.clientHeight / lines.length)),
                    lines.length - 1
                );
                focusLine(lineIndex, 0);
            }
        });
    });
    </script>
</body>
</html>
